<svg xmlns="http://www.w3.org/2000/svg" width="680" height="620" viewBox="0 0 680 620" role="img" aria-label="Controlled copilot architecture">
<title>Controlled copilot architecture</title>
<desc>An operator question goes to an LLM semantic adapter that only maps text to a structured query frame. A deterministic contract pipeline (sufficiency gate, evidence resolution, refusal and warning policy, verbalization) reads live VRPTW solver state and produces a grounded answer with evidence.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
<path d="M2 1L8 5L2 9" fill="none" stroke="#5f5e5a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
</marker>
</defs>
<rect x="0.5" y="0.5" width="679" height="619" rx="14" fill="#fcfcfb" stroke="#e6e4dc" stroke-width="1"/>
<g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14">

<rect x="390" y="28" width="14" height="14" rx="3" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
<text x="412" y="39" font-size="12" fill="#5f5e5a">LLM: proposes intent</text>
<rect x="390" y="50" width="14" height="14" rx="3" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="412" y="61" font-size="12" fill="#5f5e5a">Contract: grounds &amp; decides</text>

<rect x="60" y="20" width="300" height="50" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
<text x="210" y="40" text-anchor="middle" font-weight="500" fill="#2c2c2a">Operator question</text>
<text x="210" y="58" text-anchor="middle" font-size="12" fill="#5f5e5a">natural language</text>
<line x1="210" y1="70" x2="210" y2="90" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="60" y="94" width="300" height="58" rx="8" fill="#eeedfe" stroke="#534ab7" stroke-width="0.5"/>
<text x="210" y="118" text-anchor="middle" font-weight="500" fill="#26215c">LLM semantic adapter</text>
<text x="210" y="138" text-anchor="middle" font-size="12" fill="#534ab7">text &#8594; query frame &#183; can't answer</text>
<line x1="210" y1="152" x2="210" y2="176" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="44" y="180" width="332" height="316" rx="14" fill="none" stroke="#888780" stroke-width="0.5" stroke-dasharray="5 4"/>
<text x="210" y="204" text-anchor="middle" font-weight="500" fill="#444441">Deterministic contract pipeline</text>

<rect x="64" y="212" width="292" height="50" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="210" y="232" text-anchor="middle" font-weight="500" fill="#04342c">Sufficiency gate</text>
<text x="210" y="250" text-anchor="middle" font-size="12" fill="#0f6e56">is the solver state enough?</text>
<line x1="210" y1="262" x2="210" y2="276" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="64" y="278" width="292" height="50" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="210" y="298" text-anchor="middle" font-weight="500" fill="#04342c">Evidence resolution</text>
<text x="210" y="316" text-anchor="middle" font-size="12" fill="#0f6e56">pull exact solver fields</text>
<line x1="210" y1="328" x2="210" y2="342" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="64" y="344" width="292" height="50" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="210" y="364" text-anchor="middle" font-weight="500" fill="#04342c">Refusal &amp; warning policy</text>
<text x="210" y="382" text-anchor="middle" font-size="12" fill="#0f6e56">false-premise guards</text>
<line x1="210" y1="394" x2="210" y2="408" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<rect x="64" y="410" width="292" height="50" rx="8" fill="#e1f5ee" stroke="#0f6e56" stroke-width="0.5"/>
<text x="210" y="430" text-anchor="middle" font-weight="500" fill="#04342c">Verbalization</text>
<text x="210" y="448" text-anchor="middle" font-size="12" fill="#0f6e56">grounded fields &#8594; answer</text>

<rect x="420" y="300" width="210" height="64" rx="8" fill="#f7f6f0" stroke="#5f5e5a" stroke-width="0.5" stroke-dasharray="5 4"/>
<text x="525" y="326" text-anchor="middle" font-weight="500" fill="#2c2c2a">Live VRPTW solver state</text>
<text x="525" y="346" text-anchor="middle" font-size="12" fill="#5f5e5a">payload snapshots</text>
<line x1="418" y1="332" x2="378" y2="332" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>

<line x1="210" y1="496" x2="210" y2="520" stroke="#5f5e5a" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="522" width="300" height="58" rx="8" fill="#f1efe8" stroke="#888780" stroke-width="0.5"/>
<text x="210" y="546" text-anchor="middle" font-weight="500" fill="#2c2c2a">Grounded answer + evidence</text>
<text x="210" y="566" text-anchor="middle" font-size="12" fill="#5f5e5a">to operator UI: map &#183; schedule</text>

</g>
</svg>
